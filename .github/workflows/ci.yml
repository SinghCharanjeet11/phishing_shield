name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests must never touch the real model or the shared MLflow store.
      MODEL_DIR: ${{ github.workspace }}/.ci-artifacts/model
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/.ci-artifacts/mlflow.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          mkdir -p .ci-artifacts
          pytest tests/ -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build image
        if: steps.dockerfile.outputs.exists == 'true'
        run: docker build -t phishing-shield:ci .

      - name: Skip (no Dockerfile yet)
        if: steps.dockerfile.outputs.exists != 'true'
        run: echo "No Dockerfile on this branch yet; skipping the image build."
